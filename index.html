<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* CONTENEDOR */
#contador-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* TARJETAS */
.card {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* NÚMEROS */
.number {
  font-size: 28px;
  font-weight: bold;
  color: white;
}

/* BOTÓN LIKE */
.btn {
  width: 100%;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: #F56F27;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* CAJA VISITAS */
.label {
  width: 100%;
  height: 42px;
  background: #F56F27;
  color: white;
  font-weight: bold;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;
  font-size: 15px;
}

/* MOBILE */
@media (max-width: 500px) {
  .card {
    width: 45%;
  }

  .number {
    font-size: 24px;
  }

  .btn, .label {
    height: 38px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div id="contador-container">

  <!-- Likes -->
  <div class="card">
    <div id="likes-number" class="number">0</div>
    <button id="like-button" class="btn">Like</button>
  </div>

  <!-- Visitas -->
  <div class="card">
    <div id="visitas-number" class="number">0</div>
    <div class="label">Visitas</div>
  </div>

</div>

<!-- FIREBASE COMPAT -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://mcbe-zringpvp-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const likesRef = db.ref("contador/likes");
const visitasRef = db.ref("contador/visitas");

// VISITAS (suma 1 por carga)
visitasRef.once("value").then(s => {
  visitasRef.set((s.val() || 0) + 1);
});

// Mostrar visitas en tiempo real
visitasRef.on("value", s => {
  document.getElementById("visitas-number").innerText = s.val() || 0;
});

// Mostrar likes en tiempo real
likesRef.on("value", s => {
  document.getElementById("likes-number").innerText = s.val() || 0;
});

const btn = document.getElementById("like-button");

// evitar doble like
if (localStorage.getItem("like_zring")) {
  btn.disabled = true;
  btn.innerText = "Gracias";
  btn.style.background = "#555";
  btn.style.cursor = "default";
}

// click like
btn.onclick = () => {
  if (localStorage.getItem("like_zring")) return;

  likesRef.once("value").then(s => {
    likesRef.set((s.val() || 0) + 1);
    localStorage.setItem("like_zring", true);

    btn.disabled = true;
    btn.innerText = "Gracias";
    btn.style.background = "#555";
    btn.style.cursor = "default";
  });
};
</script>

</body>
</html>
