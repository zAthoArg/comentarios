<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial;
}

#contador-container {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  color: white;
}

.box {
  text-align: center;
  width: 110px;
}

button, .label {
  background: #F56F27;
  color: white;
  border: none;
  width: 100%;
  height: 40px;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="contador-container">

  <div class="box">
    <div id="likes-number">0</div>
    <button id="like-button">Like</button>
  </div>

  <div class="box">
    <div id="visitas-number">0</div>
    <div class="label">Visitas</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://mcbe-zringpvp-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const likesRef = db.ref("contador/likes");
const visitasRef = db.ref("contador/visitas");

// visitas
visitasRef.once("value").then(s => {
  visitasRef.set((s.val() || 0) + 1);
});

visitasRef.on("value", s => {
  document.getElementById("visitas-number").innerText = s.val() || 0;
});

// likes
likesRef.on("value", s => {
  document.getElementById("likes-number").innerText = s.val() || 0;
});

const btn = document.getElementById("like-button");

if (localStorage.getItem("like")) {
  btn.disabled = true;
  btn.innerText = "Gracias";
}

btn.onclick = () => {
  if (localStorage.getItem("like")) return;

  likesRef.once("value").then(s => {
    likesRef.set((s.val() || 0) + 1);
    localStorage.setItem("like", true);
    btn.disabled = true;
    btn.innerText = "Gracias";
  });
};
</script>

</body>
</html>
